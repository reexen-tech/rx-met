[build-system]
requires = ["setuptools>=66.1", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# PEP 621 项目元数据
# ---------------------------------------------------------------------------
[project]
name = "rx-met"
description = "Offline model quantization toolkit for AIMET, QuantGRU, and llama.cpp"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.8"
authors = [
    { name = "Qualcomm Innovation Center" },
]
keywords = ["ai", "machine-learning", "model-optimization", "quantization", "compression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 产品版本与运行时依赖分别读取 VERSION 和 requirements.txt
dynamic = ["version", "dependencies"]

[project.scripts]
rx-met = "rx_met_llm.pipeline:_cli"

# ---------------------------------------------------------------------------
# setuptools 后端配置（替代旧 setup.py 中的对应字段）
# ---------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = [
    "aimet_common",
    "aimet_common.*",
    "aimet_onnx",
    "aimet_onnx.*",
    "aimet_torch",
    "aimet_torch.*",
    "rx_met_llm",
    "rx_met_llm.*",
    "export_onnx_and_encodings",
    "export_onnx_and_encodings.*",
]

[tool.setuptools.package-data]
aimet_common = ["*.json", "*.so", "*.pyd", "*.dll", "bin/*"]
aimet_onnx = ["*.json", "*.so", "*.pyd", "*.dll"]
aimet_torch = ["*.json", "*.so", "*.pyd", "*.dll"]
rx_met_llm = ["*.md"]
export_onnx_and_encodings = ["*.json", "*.pt", "data/*"]
