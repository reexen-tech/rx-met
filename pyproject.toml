[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aimet-rx"
version = "1.3.2"
description = "AI Model Efficiency Toolkit - Redistributable Package"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.8"
authors = [
    {name = "Qualcomm Innovation Center"},
]
keywords = ["ai", "machine-learning", "model-optimization", "quantization", "compression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "onnx>=1.11.0",
    "onnxruntime>=1.13.0",
    "torch>=1.13.0",
    "pillow>=8.0.0",
    "bokeh>=2.4.0",
    "jsonschema>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/quic/aimet"













