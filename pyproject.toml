[build-system]
requires = ["setuptools>=66.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rx-met"
description = "Offline PyTorch / AIMET / QuantGRU quantization toolkit"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Qualcomm Innovation Center" },
]
keywords = ["ai", "machine-learning", "model-optimization", "quantization", "compression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dynamic = ["version", "dependencies"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "aimet_common",
    "aimet_common.*",
    "aimet_onnx",
    "aimet_onnx.*",
    "aimet_torch",
    "aimet_torch.*",
]

[tool.setuptools.package-data]
aimet_common = ["*.json", "*.so", "*.pyd", "*.dll", "bin/*", "quantsim_config/*.json"]
aimet_onnx = ["*.json", "*.so", "*.pyd", "*.dll"]
aimet_torch = ["*.json", "*.so", "*.pyd", "*.dll"]
